spring:
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  application:
    name: flowhook
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/flowhook}
    username: ${SPRING_DATASOURCE_USERNAME:flowhook}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
    hikari:
      connection-timeout: 5000
  sql:
    init:
      mode: never
  flyway:
    default-schema: public
    baseline-on-migrate: false
    baseline-version: "1"
    clean-disabled: true
    validate-migration-naming: true

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  shutdown: graceful

logging:
  level:
    root: INFO
