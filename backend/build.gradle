plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.flowhook'
version = '0.0.1-SNAPSHOT'
description = 'Reliable webhook delivery learning project'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

sourceSets {
    receiver {
        java.srcDirs = ['../demo/receiver']
        resources.srcDirs = ['../demo/receiver/resources']
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    test {
        compileClasspath += sourceSets.receiver.output
        runtimeClasspath += sourceSets.receiver.output
    }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	receiverImplementation 'org.flywaydb:flyway-core'
	receiverRuntimeOnly 'org.flywaydb:flyway-database-postgresql'
	receiverRuntimeOnly 'org.postgresql:postgresql'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('compileTestJava') {
    dependsOn tasks.named('receiverClasses')
}

tasks.register('receiver', JavaExec) {
    dependsOn tasks.named('receiverClasses')
    classpath = sourceSets.receiver.runtimeClasspath
    mainClass = 'Receiver'
    workingDir = rootDir.parentFile
    args providers.gradleProperty('receiverPort').getOrElse('9090'),
         providers.gradleProperty('receiverDelayMillis').getOrElse('8000')
}

tasks.register('receiverCheck', JavaExec) {
    dependsOn tasks.named('receiverClasses')
    classpath = sourceSets.receiver.runtimeClasspath
    mainClass = 'ReceiverTest'
}
