name: Backend CI

on:
  push:
    paths: ["backend/**", ".github/workflows/backend-build.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Test with PostgreSQL and assemble application
        run: ./gradlew --no-daemon test assemble
